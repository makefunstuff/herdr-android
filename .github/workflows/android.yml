name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew -p core test

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/herdr-android-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-android-apk
          path: out/*.apk

      # A rolling pre-release per branch so the APK has a plain download link for a phone.
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Herdr for Android build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA}. Install it on your phone by opening the .apk file."
